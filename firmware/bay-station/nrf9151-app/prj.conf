# Bay station host (nRF9151). Kconfig names to be re-checked against the
# pinned NCS release on first build.

# Logging + shell on DBG_UART (uart0)
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Modem: library, link control, GNSS. Modem firmware is Nordic's binary,
# flashed separately -- see bay-station/README.md "Modem firmware".
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
# 'at' shell command for raw AT access during bring-up (NCS AT shell lib).
CONFIG_AT_SHELL=y

# Calibration table storage (fw-m6). Off until the store is written.
# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_NVS=y
# CONFIG_SETTINGS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
