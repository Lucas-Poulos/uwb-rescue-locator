# BT840 BLE bridge. Starting point is NCS's "Bluetooth: Peripheral UART"
# sample (NUS). Kconfig names to be re-checked on the pinned NCS release.

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Logs over RTT on the BT840 SWD header (no DBG_UART on this chip).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="UWBRL-Station"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y

# Throughput: data length extension + larger MTU so one bridge frame
# (<= 242 B on the wire, see bridge_proto.h) fits one notification.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# Security: OPEN QUESTION (handoff.md). Nordic's own connectivity bridge
# ships its NUS link off by default because it is "not encrypted or
# authenticated". Minimum proposed here: bonding + encryption.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
